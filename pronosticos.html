<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronósticos - PostQuiniela</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 20px 8%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #e00000;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 40px;
    }

    .match {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .league {
      color: #e00000;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .team {
      font-size: 18px;
      font-weight: bold;
      width: 40%;
    }

    .away {
      text-align: right;
    }

    .vs {
      color: #777;
    }

    .prediction {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .prediction button {
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 7px;
      padding: 12px 18px;
      cursor: pointer;
    }

    .prediction button:hover {
      background: #e00000;
      border-color: #e00000;
    }

    .info {
      text-align: center;
      color: #777;
      margin-top: 35px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Post<span>Quiniela</span></div>
  </header>

  <main>

    <h1>Pronósticos</h1>
    <p class="subtitle">Elige el resultado que crees que ocurrirá.</p>

    <div class="match">
      <div class="league">LALIGA</div>

      <div class="teams">
        <div class="team">Barcelona</div>
        <div class="vs">VS</div>
        <div class="team away">Real Sociedad</div>
      </div>

      <div class="prediction">
        <button>Barcelona</button>
        <button>Empate</button>
        <button>Real Sociedad</button>
      </div>
    </div>

    <div class="match">
      <div class="league">LALIGA</div>

      <div class="teams">
        <div class="team">Valencia</div>
        <div class="vs">VS</div>
        <div class="team away">Sevilla</div>
      </div>

      <div class="prediction">
        <button>Valencia</button>
        <button>Empate</button>
        <button>Sevilla</button>
      </div>
    </div>

    <div class="match">
      <div class="league">CHAMPIONS LEAGUE</div>

      <div class="teams">
        <div class="team">Barcelona</div>
        <div class="vs">VS</div>
        <div class="team away">Inter</div>
      </div>

      <div class="prediction">
        <button>Barcelona</button>
        <button>Empate</button>
        <button>Inter</button>
      </div>
    </div>

    <p class="info">
      Los pronósticos se bloquearán cuando comience el partido.
    </p>

  </main>

</body>
</html>
