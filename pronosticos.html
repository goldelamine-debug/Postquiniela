<script>
document.getElementById('guardarPronosticos').addEventListener('click', () => {
  const partidos = document.querySelectorAll('.match');
  let completos = true;

  partidos.forEach(partido => {
    const id = partido.dataset.matchId;

    const eleccion = localStorage.getItem('eleccion_' + id);

    const marcador = JSON.parse(
      localStorage.getItem('marcador_' + id) || '[]'
    );

    if (
      eleccion === null ||
      marcador.length !== 2 ||
      marcador[0] === '' ||
      marcador[1] === ''
    ) {
      completos = false;
    }
  });

  if (!completos) {
    alert('Completa todos los pronósticos antes de guardar.');
    return;
  }

  localStorage.setItem('pronosticos_confirmados', 'true');
  alert('¡Pronósticos guardados correctamente!');
});


const partidos = document.querySelectorAll('.match');

partidos.forEach(partido => {
  const id = partido.dataset.matchId;
  const marcadores = partido.querySelectorAll('input[type="number"]');

  marcadores.forEach(input => {
    input.addEventListener('input', () => {
      localStorage.setItem(
        'marcador_' + id,
        JSON.stringify(Array.from(marcadores).map(i => i.value))
      );
    });
  });

  const guardados = JSON.parse(
    localStorage.getItem('marcador_' + id) || '[]'
  );

  marcadores.forEach((input, i) => {
    if (guardados[i] !== undefined) {
      input.value = guardados[i];
    }
  });
});


const elecciones = document.querySelectorAll('.prediction button');

elecciones.forEach(boton => {
  boton.addEventListener('click', () => {
    const partido = boton.closest('.match');
    const id = partido.dataset.matchId;

    const botonesGrupo = Array.from(
      boton.parentElement.querySelectorAll('button')
    );

    const posicion = botonesGrupo.indexOf(boton);

    botonesGrupo.forEach(b => {
      b.style.background = '#222';
      b.style.borderColor = '#444';
    });

    boton.style.background = '#e00000';
    boton.style.borderColor = '#e00000';

    localStorage.setItem('eleccion_' + id, posicion);
  });
});


elecciones.forEach(boton => {
  const partido = boton.closest('.match');
  const id = partido.dataset.matchId;

  const guardado = localStorage.getItem('eleccion_' + id);

  if (guardado !== null) {
    const botonesGrupo = Array.from(
      boton.parentElement.querySelectorAll('button')
    );

    if (botonesGrupo.indexOf(boton) === Number(guardado)) {
      boton.style.background = '#e00000';
      boton.style.borderColor = '#e00000';
    }
  }
});
</script>
