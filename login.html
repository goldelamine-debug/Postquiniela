<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - PostQuiniela</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #111;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 10px 0;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #e00000;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h1>Iniciar sesión</h1>

    <input type="email" id="email" placeholder="Correo electrónico">

    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="probarBoton()">Iniciar sesión</button>
  </div>

  <script>
    function probarBoton() {
      alert("EL BOTÓN FUNCIONA");
    }
  </script>

</body>
</html>
