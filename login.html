<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - PostQuiniela</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }

    .contenedor {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #111;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 15px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #e00000;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="contenedor">
  <h1>Iniciar sesión</h1>

  <input type="email" id="email" placeholder="Correo electrónico">

  <input type="password" id="password" placeholder="Contraseña">

  <button id="iniciarSesion">Iniciar sesión</button>

  <p id="mensaje"></p>
  <p>
  ¿No tienes cuenta?
  <a href="registro.html" style="color:#e00000;">Crear cuenta</a>
</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://jotbnhmusmlrnqtswnkx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-OyPy0c9FWB6alBarpEIvQ_bWoWE0S7';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById('iniciarSesion').addEventListener('click', async () => {

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const mensaje = document.getElementById('mensaje');

  const { error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    mensaje.textContent = error.message;
    return;
  }

  mensaje.textContent = '¡Inicio de sesión correcto!';
});
</script>

</body>
</html>
