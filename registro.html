<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - PostQuiniela</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }

    .contenedor {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #111;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 15px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #e00000;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
    }

    a {
      color: #e00000;
    }
  </style>
</head>

<body>

<div class="contenedor">
  <h1>Crear cuenta</h1>

  <input type="text" id="username" placeholder="Nombre de usuario">

  <input type="email" id="email" placeholder="Correo electrónico">

  <input type="password" id="password" placeholder="Contraseña">

  <button id="crearCuenta">Crear cuenta</button>

  <p id="mensaje"></p>

  <p style="text-align:center;">
    ¿Ya tienes cuenta?
    <a href="login.html">Iniciar sesión</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://jotbnhmusmlrnqtswnkx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-OyPy0c9FWB6alBarpEIvQ_bWoWE0S7';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById('crearCuenta').addEventListener('click', async () => {

  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const mensaje = document.getElementById('mensaje');

  const { data, error } = await supabase.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    mensaje.textContent = error.message;
    return;
  }

  const user = data.user;

  const { error: profileError } = await supabase
    .from('profiles')
    .insert({
      id: user.id,
      username: username
    });

  if (profileError) {
    mensaje.textContent = profileError.message;
    return;
  }

  mensaje.textContent = '¡Cuenta creada correctamente!';
});
</script>

</body>
</html>
